{% extends "base.html" %}

{% block title %}Editar fecha · {{ program.title }}{% endblock %}

{% block content %}
{% include "components/topbar.html" with context %}

<style>
    .session-edit-form {
        max-width: 620px;
    }

    .session-edit-form label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        font-weight: 700;
    }

    .session-edit-form input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
    }

    .session-edit-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    .session-edit-save {
        padding: 11px 18px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }

    .session-edit-cancel {
        padding: 11px 18px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        text-decoration: none;
        color: #334155;
        font-weight: 700;
    }

    .session-edit-error {
        margin-bottom: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #fef2f2;
        color: #991b1b;
        font-weight: 700;
    }
</style>

{% if error_message %}
    <div class="session-edit-error">
        {{ error_message }}
    </div>
{% endif %}

<div class="card session-edit-form">

    <h2>Editar fecha</h2>

    <form method="post">

        <label for="session_title">
            Nombre de la sesión
        </label>

        <input
            id="session_title"
            name="session_title"
            value="{{ session.session_title or '' }}"
        >

        <label for="session_date">
            Fecha
        </label>

        <input
            id="session_date"
            name="session_date"
            type="date"
            value="{{ session.session_date.isoformat() }}"
            required
        >

        <label for="start_time">
            Hora de inicio
        </label>

        <input
            id="start_time"
            name="start_time"
            type="time"
            value="{{ session.start_time_input }}"
        >

        <label for="end_time">
            Hora de término
        </label>

        <input
            id="end_time"
            name="end_time"
            type="time"
            value="{{ session.end_time_input }}"
        >

        <div class="session-edit-actions">
            <button
                class="session-edit-save"
                type="submit"
            >
                Guardar cambios
            </button>

            <a
                class="session-edit-cancel"
                href="/whatsapp/dashboard/business/{{ business.slug }}/events/{{ program.id }}"
            >
                Cancelar
            </a>
        </div>

    </form>

</div>

{% endblock %}
