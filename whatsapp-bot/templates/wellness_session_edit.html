{% extends "base.html" %}

{% block title %}Editar sesión · {{ business.business_name }}{% endblock %}

{% block content %}
{% include "components/topbar.html" with context %}

<style>
    .session-edit-card {
        max-width: 760px;
    }

    .session-edit-card label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        font-weight: 700;
    }

    .session-edit-card input,
    .session-edit-card select,
    .session-edit-card textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
    }

    .session-edit-card textarea {
        min-height: 100px;
        resize: vertical;
    }

    .session-edit-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    .session-edit-save {
        padding: 11px 18px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }

    .session-edit-cancel {
        padding: 11px 18px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        text-decoration: none;
        color: #334155;
        font-weight: 700;
    }

    .session-edit-error {
        margin-bottom: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #fef2f2;
        color: #991b1b;
        font-weight: 700;
    }
</style>

{% if error_message %}
    <div class="session-edit-error">
        {{ error_message }}
    </div>
{% endif %}

<div class="card session-edit-card">

    <h2>Editar sesión</h2>

    <form method="post">

        <label for="customer_name">
            Nombre del cliente
        </label>

        <input
            id="customer_name"
            name="customer_name"
            value="{{ request.form.get('customer_name', appointment.customer_name or '') }}"
            required
        >

        <label for="customer_phone">
            Teléfono
        </label>

        <input
            id="customer_phone"
            name="customer_phone"
            type="tel"
            value="{{ request.form.get('customer_phone', appointment.customer_phone or '') }}"
            required
        >

        <label for="session_type_id">
            Tipo de sesión
        </label>

        <select
            id="session_type_id"
            name="session_type_id"
            required
        >
            {% for item in session_types %}
                <option
                    value="{{ item.id }}"
                    {% if request.form.get('session_type_id', appointment.session_type_id|string) == item.id|string %}
                        selected
                    {% endif %}
                >
                    {{ item.name }}
                    · {{ item.duration_minutes }} min
                </option>
            {% endfor %}
        </select>

        <label for="appointment_date">
            Fecha
        </label>

        <input
            id="appointment_date"
            name="appointment_date"
            type="date"
            value="{{ request.form.get('appointment_date', appointment.appointment_date) }}"
            required
        >

        <label for="appointment_time">
            Hora de inicio
        </label>

        <input
            id="appointment_time"
            name="appointment_time"
            type="time"
            value="{{ request.form.get('appointment_time', appointment.appointment_time_input) }}"
            required
        >

        <label for="status">
            Estado
        </label>

        <select
            id="status"
            name="status"
        >
            <option
                value="pending"
                {% if request.form.get('status', appointment.status) == 'pending' %}selected{% endif %}
            >
                Pendiente
            </option>

            <option
                value="confirmed"
                {% if request.form.get('status', appointment.status) == 'confirmed' %}selected{% endif %}
            >
                Confirmada
            </option>

            <option
                value="completed"
                {% if request.form.get('status', appointment.status) == 'completed' %}selected{% endif %}
            >
                Completada
            </option>

            <option
                value="cancelled"
                {% if request.form.get('status', appointment.status) == 'cancelled' %}selected{% endif %}
            >
                Cancelada
            </option>
        </select>

        <label for="notes">
            Notas
        </label>

        <textarea
            id="notes"
            name="notes"
        >{{ request.form.get('notes', appointment.notes or '') }}</textarea>

        <div class="session-edit-actions">
            <button
                class="session-edit-save"
                type="submit"
            >
                Guardar cambios
            </button>

            <a
                class="session-edit-cancel"
                href="/whatsapp/dashboard/business/{{ business.slug }}/sessions"
            >
                Cancelar
            </a>
        </div>

    </form>

</div>

{% endblock %}
